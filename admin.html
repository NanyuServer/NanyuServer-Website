<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招聘管理 — 南渝万能墙</title>
  <link rel="icon" href="websitelogo.ico" />
  <style>
    :root {
      --bg: #0F0A1A;
      --card: #120F17;
      --accent: #B388FF;
      --gold: #e8c97a;
      --green: #34d399;
      --red: #f87171;
      --text: #fff;
      --text2: #E0D7FF;
      --muted: #9E8BBF;
      --border: rgba(123, 85, 212, 0.25);
      --radius: 12px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(123, 85, 212, 0.3); border-radius: 100px; }

    .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .login-card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 2.5rem 2rem; text-align: center; }
    .login-title { font-size: 1.3rem; font-weight: 700; color: var(--gold); margin-bottom: 0.5rem; }
    .login-sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 2rem; }
    .login-input { width: 100%; padding: 0.8rem 1rem; font-size: 1rem; color: var(--text); background: rgba(15,10,26,0.6); border: 1px solid var(--border); border-radius: var(--radius); outline: none; margin-bottom: 1rem; font-family: var(--font); }
    .login-input:focus { border-color: var(--accent); }
    .login-input::placeholder { color: var(--muted); opacity: 0.5; }
    .login-btn { width: 100%; padding: 0.8rem; font-size: 0.95rem; font-weight: 600; color: white; background: rgba(75, 47, 163, 0.6); border: 1px solid rgba(179, 136, 255, 0.3); border-radius: var(--radius); cursor: pointer; font-family: var(--font); transition: background 0.2s; }
    .login-btn:hover { background: rgba(75, 47, 163, 0.8); }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .login-error { color: var(--red); font-size: 0.8rem; margin-top: 0.5rem; min-height: 1.2rem; }

    .admin-page { display: none; padding: 1rem; max-width: 800px; margin: 0 auto; }
    .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0 1.5rem; }
    .admin-header h1 { font-size: 1.1rem; color: var(--gold); }
    .admin-logout { font-size: 0.78rem; color: var(--muted); background: none; border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer; font-family: var(--font); }
    .admin-logout:hover { color: var(--text); border-color: var(--accent); }

    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(123,85,212,0.15); }
    .tab { flex: 1; padding: 0.7rem; text-align: center; font-size: 0.85rem; color: var(--muted); background: none; border: none; cursor: pointer; border-bottom: 2px solid transparent; font-family: var(--font); transition: all 0.2s; }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: var(--radius); padding: 1.2rem; margin-bottom: 1rem; }
    .card-title { font-size: 0.85rem; font-weight: 700; color: var(--gold); margin-bottom: 1rem; }

    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }
    .field-label { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.4rem; display: block; }
    .field-input { width: 100%; padding: 0.65rem 0.8rem; font-size: 0.85rem; color: var(--text); background: rgba(15,10,26,0.6); border: 1px solid var(--border); border-radius: 8px; outline: none; font-family: var(--font); }
    .field-input:focus { border-color: var(--accent); }
    .field-input::placeholder { color: var(--muted); opacity: 0.4; }
    textarea.field-input { resize: vertical; min-height: 80px; line-height: 1.6; }

    .btn { padding: 0.6rem 1.2rem; font-size: 0.82rem; font-weight: 600; border-radius: 8px; border: none; cursor: pointer; font-family: var(--font); transition: all 0.2s; }
    .btn-primary { background: rgba(75, 47, 163, 0.6); color: white; border: 1px solid rgba(179, 136, 255, 0.3); }
    .btn-primary:hover { background: rgba(75, 47, 163, 0.8); }
    .btn-danger { background: rgba(248, 113, 113, 0.15); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.3); }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.25); }
    .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.75rem; }
    .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; }

    .pos-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .pos-item { display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem 1rem; background: rgba(15,10,26,0.5); border: 1px solid var(--border); border-radius: var(--radius); }
    .pos-item-info { flex: 1; min-width: 0; }
    .pos-item-name { font-size: 0.88rem; font-weight: 600; color: var(--text); margin-bottom: 0.2rem; }
    .pos-item-desc { font-size: 0.75rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pos-item-actions { display: flex; gap: 0.4rem; flex-shrink: 0; }

    .applicant-item { padding: 0.9rem 1rem; background: rgba(15,10,26,0.5); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 0.6rem; }
    .applicant-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .applicant-name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .applicant-time { font-size: 0.7rem; color: var(--muted); }
    .applicant-detail { font-size: 0.78rem; color: var(--text2); line-height: 1.6; }
    .applicant-detail span { color: var(--muted); }

    .empty { text-align: center; padding: 2rem; color: var(--muted); font-size: 0.85rem; }

    .msg { text-align: center; padding: 0.5rem; font-size: 0.78rem; min-height: 1.5rem; }
    .msg.ok { color: var(--green); }
    .msg.err { color: var(--red); }
  </style>
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-title">招聘管理</div>
    <div class="login-sub">输入手机号登录</div>
    <input type="tel" class="login-input" id="phoneInput" placeholder="请输入手机号" maxlength="11" />
    <button class="login-btn" id="loginBtn" type="button">登录</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="admin-page" id="adminPage">
  <div class="admin-header">
    <h1>招聘管理</h1>
    <button class="admin-logout" id="logoutBtn" type="button">退出</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="positions" type="button">岗位管理</button>
    <button class="tab" data-tab="applicants" type="button">报名记录</button>
  </div>

  <div class="tab-panel active" id="panel-positions">
    <div class="card">
      <div class="card-title" id="formTitle">添加岗位</div>
      <input type="hidden" id="editId" />
      <div class="field">
        <label class="field-label">岗位名称 *</label>
        <input type="text" class="field-input" id="posTitle" placeholder="如：内容运营" />
      </div>
      <div class="field">
        <label class="field-label">岗位描述</label>
        <textarea class="field-input" id="posDesc" placeholder="描述岗位职责和要求"></textarea>
      </div>
      <div class="field">
        <label class="field-label">标签（逗号分隔）</label>
        <input type="text" class="field-input" id="posTags" placeholder="如：运营,内容" />
      </div>
      <div class="msg" id="posMsg"></div>
      <div class="btn-group">
        <button class="btn btn-primary" id="posSaveBtn" type="button">保存</button>
        <button class="btn btn-sm" id="posCancelBtn" type="button" style="display:none;">取消编辑</button>
      </div>
    </div>
    <div class="pos-list" id="posList"></div>
  </div>

  <div class="tab-panel" id="panel-applicants">
    <div id="applicantList"></div>
  </div>
</div>

<script>
(function() {
  var API_BASE = '/api';
  var AUTH_PHONE = '18306090700';
  var adminToken = '';
  var editingId = null;

  function request(url, options) {
    var opts = Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {});
    if (adminToken) opts.headers['x-admin-secret'] = adminToken;
    return fetch(API_BASE + url, opts)
      .then(function(res) { return res.json().catch(function() { return {}; }).then(function(json) { if (!res.ok) throw new Error(json.error || 'HTTP ' + res.status); return json; }); });
  }

  function $(id) { return document.getElementById(id); }

  function initAuth() {
    var saved = localStorage.getItem('recruitAdminToken');
    if (saved) {
      adminToken = saved;
      fetch(API_BASE + '/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-action': 'verify', 'x-admin-secret': saved }
      }).then(function(res) {
        if (res.ok) {
          $('loginPage').style.display = 'none';
          $('adminPage').style.display = 'block';
          loadAll();
        } else {
          localStorage.removeItem('recruitAdminToken');
          adminToken = '';
        }
      }).catch(function() {
        localStorage.removeItem('recruitAdminToken');
        adminToken = '';
      });
    }
  }

  $('loginBtn').addEventListener('click', function() {
    var phone = $('phoneInput').value.trim();
    if (phone !== AUTH_PHONE) {
      $('loginError').textContent = '手机号不正确';
      return;
    }
    $('loginBtn').disabled = true;
    $('loginBtn').textContent = '登录中…';
    $('loginError').textContent = '';

    fetch(API_BASE + '/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-action': 'login' },
      body: JSON.stringify({ username: 'admin', password: 'nywll2026' })
    }).then(function(res) {
      return res.json().then(function(json) {
        if (!res.ok) throw new Error(json.error || '认证失败');
        return json;
      });
    }).then(function(data) {
      if (data.token) {
        adminToken = data.token;
        localStorage.setItem('recruitAdminToken', adminToken);
        $('loginPage').style.display = 'none';
        $('adminPage').style.display = 'block';
        loadAll();
      } else {
        throw new Error('未获取到令牌');
      }
    }).catch(function(e) {
      $('loginError').textContent = e.message || '登录失败';
    }).finally(function() {
      $('loginBtn').disabled = false;
      $('loginBtn').textContent = '登录';
    });
  });

  $('phoneInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') $('loginBtn').click();
  });

  $('logoutBtn').addEventListener('click', function() {
    adminToken = '';
    localStorage.removeItem('recruitAdminToken');
    $('adminPage').style.display = 'none';
    $('loginPage').style.display = 'flex';
  });

  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      document.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
      tab.classList.add('active');
      $('panel-' + tab.getAttribute('data-tab')).classList.add('active');
      if (tab.getAttribute('data-tab') === 'applicants') loadApplicants();
    });
  });

  function loadAll() {
    loadPositions();
    loadApplicants();
  }

  function loadPositions() {
    request('/recruitments').then(function(json) {
      var list = Array.isArray(json.data) ? json.data : [];
      var el = $('posList');
      if (!list.length) { el.innerHTML = '<div class="empty">暂无岗位</div>'; return; }
      el.innerHTML = list.map(function(p) {
        return '<div class="pos-item">' +
          '<div class="pos-item-info"><div class="pos-item-name">' + esc(p.title) + '</div>' +
          '<div class="pos-item-desc">' + esc(p.description || '无描述') + '</div></div>' +
          '<div class="pos-item-actions">' +
          '<button class="btn btn-primary btn-sm" onclick="editPos(' + p.id + ',\'' + esc(p.title) + '\',\'' + esc(p.description || '') + '\',\'' + esc(p.tags || '') + '\')">编辑</button>' +
          '<button class="btn btn-danger btn-sm" onclick="deletePos(' + p.id + ')">删除</button>' +
          '</div></div>';
      }).join('');
    }).catch(function() { $('posList').innerHTML = '<div class="empty">加载失败</div>'; });
  }

  function loadApplicants() {
    request('/recruit-applicants').then(function(json) {
      var list = Array.isArray(json.data) ? json.data : [];
      var el = $('applicantList');
      if (!list.length) { el.innerHTML = '<div class="empty">暂无报名记录</div>'; return; }
      el.innerHTML = list.map(function(a) {
        var time = a.created_at ? new Date(a.created_at).toLocaleString('zh-CN') : '';
        return '<div class="applicant-item">' +
          '<div class="applicant-head"><span class="applicant-name">' + esc(a.name) + '</span><span class="applicant-time">' + time + '</span></div>' +
          '<div class="applicant-detail">' +
          '<span>岗位：</span>' + esc(a.position_title || '') + '<br>' +
          '<span>联系方式：</span>' + esc(a.qq || '') +
          (a.note ? '<br><span>备注：</span>' + esc(a.note) : '') +
          '</div></div>';
      }).join('');
    }).catch(function() { $('applicantList').innerHTML = '<div class="empty">加载失败</div>'; });
  }

  window.editPos = function(id, title, desc, tags) {
    editingId = id;
    $('formTitle').textContent = '编辑岗位';
    $('posTitle').value = title;
    $('posDesc').value = desc;
    $('posTags').value = tags;
    $('posCancelBtn').style.display = 'inline-flex';
  };

  window.deletePos = function(id) {
    if (!confirm('确定删除该岗位？')) return;
    request('/recruitments/' + id, { method: 'DELETE' })
      .then(function() { loadPositions(); setPosMsg('已删除', 'ok'); })
      .catch(function(e) { setPosMsg('删除失败：' + e.message, 'err'); });
  };

  $('posCancelBtn').addEventListener('click', function() {
    editingId = null;
    $('formTitle').textContent = '添加岗位';
    $('posTitle').value = '';
    $('posDesc').value = '';
    $('posTags').value = '';
    $('posCancelBtn').style.display = 'none';
    $('posMsg').textContent = '';
  });

  $('posSaveBtn').addEventListener('click', function() {
    var title = $('posTitle').value.trim();
    var desc = $('posDesc').value.trim();
    var tags = $('posTags').value.trim();
    if (!title) { setPosMsg('请输入岗位名称', 'err'); return; }
    if (!desc) { setPosMsg('请输入岗位描述', 'err'); return; }

    var body = JSON.stringify({ title: title, description: desc, tags: tags });
    var p;
    if (editingId) {
      p = request('/recruitments/' + editingId, { method: 'PATCH', body: body });
    } else {
      p = request('/recruitments', { method: 'POST', body: body });
    }
    p.then(function() {
      setPosMsg(editingId ? '已更新' : '已添加', 'ok');
      editingId = null;
      $('formTitle').textContent = '添加岗位';
      $('posTitle').value = '';
      $('posDesc').value = '';
      $('posTags').value = '';
      $('posCancelBtn').style.display = 'none';
      loadPositions();
    }).catch(function(e) { setPosMsg('保存失败：' + e.message, 'err'); });
  });

  function setPosMsg(msg, type) {
    var el = $('posMsg');
    el.textContent = msg;
    el.className = 'msg ' + (type || '');
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  initAuth();
})();
</script>
</body>
</html>
