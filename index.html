<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>招贤纳士 — 南渝万能墙</title>
  <link rel="icon" href="websitelogo.ico" />
  <style>
    :root {
      --bg-primary: #0F0A1A;
      --bg-secondary: #1A0E2E;
      --bg-tertiary: #2d1b6b;
      --accent-light: #B388FF;
      --accent-neon: #D500F9;
      --accent-gold: #e8c97a;
      --accent-gold2: #f5dfa0;
      --accent-rose: #e86fa3;
      --accent-teal: #5de8d0;
      --text-primary: #FFFFFF;
      --text-secondary: #E0D7FF;
      --text-muted: #9E8BBF;
      --glass-bg: rgba(30, 10, 50, 0.45);
      --glass-border: rgba(255, 255, 255, 0.15);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --radius-xl: 32px;
      --font-title: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.65;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10000;
      opacity: 0.02;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(123, 85, 212, 0.35); border-radius: 100px; }

    .navbar {
      position: fixed;
      top: 2em;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 800px;
      z-index: 9000;
      background: rgba(18, 10, 32, 0.65);
      backdrop-filter: blur(24px) saturate(180%);
      border: 0.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1), 0 8px 24px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60px;
      padding: 0 1rem;
    }
    .navbar a { display: flex; align-items: center; }
    .navbar .logo { height: 28px; filter: brightness(1.15); }

    .page-hero {
      padding: 7rem 2rem 2.5rem;
      background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
      position: relative;
      overflow: visible;
      text-align: center;
      isolation: isolate;
    }
    .page-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(75, 47, 163, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(75, 47, 163, 0.07) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
    }
    .page-hero::after {
      content: '';
      position: absolute;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      width: 200%;
      height: 200%;
      pointer-events: none;
      z-index: 0;
      background:
        conic-gradient(from 0deg at 50% 0%, transparent 0deg, rgba(123, 85, 212, 0.06) 10deg, transparent 20deg),
        conic-gradient(from 30deg at 50% 0%, transparent 0deg, rgba(168, 127, 232, 0.04) 15deg, transparent 30deg),
        conic-gradient(from 60deg at 50% 0%, transparent 0deg, rgba(232, 111, 163, 0.03) 12deg, transparent 24deg),
        conic-gradient(from -30deg at 50% 0%, transparent 0deg, rgba(93, 232, 208, 0.03) 8deg, transparent 16deg),
        conic-gradient(from 90deg at 50% 0%, transparent 0deg, rgba(123, 85, 212, 0.05) 18deg, transparent 36deg),
        conic-gradient(from -60deg at 50% 0%, transparent 0deg, rgba(232, 201, 122, 0.03) 10deg, transparent 20deg);
      mask-image: radial-gradient(ellipse 60% 50% at 50% 20%, black 0%, transparent 100%);
      -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 20%, black 0%, transparent 100%);
    }
    .page-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 550px;
      background: radial-gradient(circle, rgba(75, 47, 163, 0.5) 0%, rgba(232, 111, 163, 0.2) 50%, transparent 70%);
      z-index: 0;
    }
    .page-hero-content { position: relative; z-index: 2; }
    .page-label {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }
    .page-label::before, .page-label::after {
      content: '';
      display: block;
      width: 20px;
      height: 1px;
      background: var(--accent-gold);
    }
    .page-title {
      font-family: var(--font-title);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, var(--accent-gold), var(--text-secondary), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
    }
    .page-sub {
      font-family: var(--font-body);
      color: var(--accent-light);
      font-size: 0.95rem;
      letter-spacing: 0.06em;
    }

    .content-section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
      position: relative;
      z-index: 1;
    }

    .glass-card-base {
      background: var(--card-bg, #120F17);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .info-title {
      font-family: var(--font-title);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }
    .info-text {
      font-family: var(--font-body);
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .section-heading {
      font-family: var(--font-title);
      font-size: 1.3rem;
      color: var(--accent-gold);
      margin-bottom: 1.5rem;
    }

    .positions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    .position-card {
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.3s var(--ease-out);
      border: 1px solid rgba(123, 85, 212, 0.25);
      background: #120F17;
      border-radius: var(--radius-lg);
    }
    .position-card.selected {
      border-color: #a0f0c0;
      box-shadow: 0 0 0 2px rgba(160, 240, 192, 0.18);
    }
    .position-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }
    .position-title {
      font-family: var(--font-title);
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
    }
    .position-desc {
      font-family: var(--font-body);
      font-size: 0.85rem;
      color: var(--accent-light);
      line-height: 1.6;
      margin-bottom: 1rem;
    }
    .position-tag {
      display: inline-block;
      padding: 0.3rem 0.7rem;
      background: rgba(123, 85, 212, 0.2);
      border-radius: 4px;
      font-size: 0.75rem;
      color: white;
      font-weight: 500;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .position-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 0.75rem;
      text-decoration: none;
    }

    .form-card {
      padding: 2rem;
      background: #120F17;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-lg);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }
    .form-card-title {
      font-family: var(--font-title);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 1.25rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .form-group.full { grid-column: 1 / -1; }
    .form-label {
      color: var(--accent-light);
      font-size: 0.9rem;
    }
    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.9rem;
      margin-top: 1.2rem;
    }
    .form-note {
      margin-top: 0.85rem;
      font-size: 0.9rem;
      color: #7b55d4;
      transition: color 0.3s;
    }

    .glass-input, .glass-textarea {
      width: 100%;
      font-family: var(--font-ui);
      font-size: 0.88rem;
      color: var(--text-primary);
      background: rgba(15, 10, 26, 0.6);
      backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(123, 85, 212, 0.3);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .glass-input:focus, .glass-textarea:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(179, 136, 255, 0.15), 0 0 20px rgba(179, 136, 255, 0.08);
    }
    .glass-input::placeholder, .glass-textarea::placeholder {
      color: var(--text-muted);
      opacity: 0.6;
    }
    .glass-textarea { resize: vertical; min-height: 100px; line-height: 1.7; }

    .glass-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-ui);
      font-size: 0.88rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      padding: 0.7rem 1.8rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 100px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px) saturate(180%);
      transition: transform 0.3s var(--ease-out), box-shadow 0.3s, border-color 0.3s, background 0.3s;
    }
    .glass-btn:active { transform: scale(0.96); }
    .glass-btn-primary {
      background: rgba(75, 47, 163, 0.5);
      color: white;
      box-shadow: 0 8px 28px rgba(75, 47, 163, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .glass-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 36px rgba(75, 47, 163, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      background: rgba(75, 47, 163, 0.6);
    }
    .glass-btn-sm { padding: 0.45rem 1.2rem; font-size: 0.8rem; }

    .gs-wrap { position: relative; width: 100%; }
    .gs-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      color: var(--text-primary);
      background: rgba(15, 10, 26, 0.6);
      backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(123, 85, 212, 0.3);
      padding: 0.7rem 1rem;
      cursor: pointer;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      text-align: left;
      appearance: none;
      border-radius: var(--radius-sm, 8px);
    }
    .gs-trigger.placeholder { color: var(--text-muted); opacity: 0.6; }
    .gs-trigger.open {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(179, 136, 255, 0.15), 0 0 20px rgba(179, 136, 255, 0.08);
    }
    .gs-arrow {
      width: 16px; height: 16px; flex-shrink: 0;
      color: var(--text-muted);
      transition: transform 0.25s var(--ease-out);
    }
    .gs-trigger.open .gs-arrow { transform: rotate(180deg); }
    .gs-dropdown {
      position: fixed;
      z-index: 20000;
      background: rgba(20, 12, 40, 0.97);
      backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid rgba(179, 136, 255, 0.25);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 24px rgba(179, 136, 255, 0.08);
      padding: 0.35rem;
      max-height: 260px;
      overflow-y: auto;
      border-radius: var(--radius-md, 16px);
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
      transition: opacity 0.2s var(--ease-out), transform 0.2s var(--ease-out);
      pointer-events: none;
    }
    .gs-dropdown.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    .gs-option {
      display: block;
      width: 100%;
      text-align: left;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      border-radius: 12px;
    }
    .gs-option:hover { color: var(--text-primary); background: rgba(179, 136, 255, 0.12); }
    .gs-option.active { color: var(--accent-gold); background: rgba(179, 136, 255, 0.18); }
    .gs-dropdown::-webkit-scrollbar { width: 4px; }
    .gs-dropdown::-webkit-scrollbar-track { background: transparent; }
    .gs-dropdown::-webkit-scrollbar-thumb { background: rgba(123, 85, 212, 0.3); border-radius: 100px; }

    .empty-card {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      padding: 1.5rem;
      color: var(--accent-light);
      border: 1px dashed rgba(123, 85, 212, 0.4);
      grid-column: 1 / -1;
      background: #120F17;
      border-radius: var(--radius-lg);
    }

    .app-footer {
      padding: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(75, 47, 163, 0.2);
      background: linear-gradient(0deg, rgba(15, 10, 26, 0.9), transparent);
    }
    .footer-copy {
      font-family: var(--font-body);
      font-size: 0.73rem;
      color: var(--accent-light);
      letter-spacing: 0.06em;
      opacity: 0.6;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 768px) {
      .page-hero { padding: 6rem 1.25rem 2.5rem; overflow: visible; }
      .page-orb { width: 400px; height: 350px; }
      .page-title { font-size: clamp(1.6rem, 7vw, 2.4rem); }
      .content-section { padding: 2rem 1.25rem; }
      .positions-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html"><img src="logo.webp" alt="南渝万能墙" class="logo" /></a>
</nav>

<div class="page-hero">
  <div class="page-orb" />
  <div class="page-hero-content">
    <div class="page-label">加入我们</div>
    <h1 class="page-title">招贤纳士</h1>
    <p class="page-sub">诚邀优秀的学生加入运营团队，共同为校园服务</p>
  </div>
</div>

<div class="content-section">
  <div class="glass-card-base" style="padding:2rem; margin-bottom:2rem;">
    <div class="info-title">📋 关于本岗位</div>
    <div class="info-text">南渝万能墙是一个致力于为学生服务的校园平台，我们诚邀热心、有想法、有执行力的同学加入我们的运营团队。通过参与平台的日常运营，你将获得宝贵的团队协作、项目管理和沟通能力。</div>
  </div>

  <h2 class="section-heading">🎯 招聘岗位</h2>
  <div class="positions-grid" id="positionsGrid">
    <div class="empty-card">招聘岗位加载中，请稍候。</div>
  </div>

  <div class="form-card" style="margin-top:2rem;">
    <div class="form-card-title">📝 岗位报名</div>
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">姓名</label>
        <input type="text" class="glass-input" id="formName" placeholder="请输入姓名" />
      </div>
      <div class="form-group">
        <label class="form-label">意向岗位</label>
        <div class="gs-wrap" id="positionSelect">
          <button class="gs-trigger placeholder" type="button" id="positionTrigger">
            <span>请选择意向岗位</span>
            <svg class="gs-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9" /></svg>
          </button>
          <div class="gs-dropdown" id="positionDropdown"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">联系方式（QQ）</label>
        <input type="text" class="glass-input" id="formQQ" placeholder="请输入QQ号" />
      </div>
      <div class="form-group full">
        <label class="form-label">备注（选填）</label>
        <textarea class="glass-textarea" id="formNote" placeholder="如有特殊时间、技能或期望可以填写" rows="4"></textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="glass-btn glass-btn-primary" id="submitBtn" type="button">提交报名</button>
    </div>
    <div class="form-note" id="formNote2">我们会尽快联系你，请保证联系方式正确。</div>
  </div>
</div>

<footer class="app-footer">
  <div class="footer-copy">&copy; 2026 南渝万能墙运营队 · 保留所有权利</div>
</footer>

<script>
(function() {
  const API_BASE = '/api';
  let positions = [];
  let selectedPositionId = '';

  async function request(url, options) {
    const res = await fetch(API_BASE + url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options || {}));
    const json = await res.json().catch(function() { return {}; });
    if (!res.ok) throw new Error(json.error || 'HTTP ' + res.status);
    return json;
  }

  function setFormNote(msg, color) {
    var el = document.getElementById('formNote2');
    el.textContent = msg;
    el.style.color = color || '#7b55d4';
  }

  function renderPositions() {
    var grid = document.getElementById('positionsGrid');
    if (!positions.length) {
      grid.innerHTML = '<div class="empty-card">暂无招聘岗位</div>';
      return;
    }
    grid.innerHTML = positions.map(function(pos) {
      var tags = pos.tags ? pos.tags.split(',').map(function(t) {
        return '<span class="position-tag">' + t.trim() + '</span>';
      }).join('') : '';
      var linkHtml = pos.apply_url
        ? '<a href="' + pos.apply_url + '" target="_blank" class="position-link glass-btn glass-btn-primary glass-btn-sm" onclick="event.stopPropagation()">立即报名</a>'
        : '';
      return '<div class="position-card" data-id="' + pos.id + '">' +
        '<div class="position-title">' + pos.title + '</div>' +
        '<div class="position-desc">' + (pos.description || '') + '</div>' +
        tags + linkHtml +
        '</div>';
    }).join('');

    grid.querySelectorAll('.position-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var id = this.getAttribute('data-id');
        selectPosition(id);
      });
    });
  }

  function selectPosition(id) {
    selectedPositionId = id;
    document.querySelectorAll('.position-card').forEach(function(c) {
      c.classList.toggle('selected', c.getAttribute('data-id') === id);
    });
    var pos = positions.find(function(p) { return String(p.id) === String(id); });
    if (pos) {
      setFormNote('已选择岗位：' + pos.title + '，请完成报名信息后提交。', '#a0f0c0');
    }
    var trigger = document.getElementById('positionTrigger');
    var label = trigger.querySelector('span');
    label.textContent = pos ? pos.title : '请选择意向岗位';
    label.classList.remove('placeholder');
  }

  var dropdownOpen = false;
  var triggerEl = document.getElementById('positionTrigger');
  var dropdownEl = document.getElementById('positionDropdown');

  function renderDropdownOptions() {
    var html = '<button class="gs-option' + (!selectedPositionId ? ' active' : '') + '" data-value="">请选择意向岗位</button>';
    positions.forEach(function(p) {
      html += '<button class="gs-option' + (String(p.id) === selectedPositionId ? ' active' : '') + '" data-value="' + p.id + '">' + p.title + '</button>';
    });
    dropdownEl.innerHTML = html;
    dropdownEl.querySelectorAll('.gs-option').forEach(function(opt) {
      opt.addEventListener('click', function(e) {
        e.stopPropagation();
        var val = this.getAttribute('data-value');
        if (val) selectPosition(val);
        else {
          selectedPositionId = '';
          triggerEl.querySelector('span').textContent = '请选择意向岗位';
          triggerEl.querySelector('span').classList.add('placeholder');
          setFormNote('我们会尽快联系你，请保证联系方式正确。', '#7b55d4');
        }
        closeDropdown();
      });
    });
  }

  function openDropdown() {
    var rect = triggerEl.getBoundingClientRect();
    var spaceBelow = window.innerHeight - rect.bottom;
    var dropHeight = Math.min((positions.length + 1) * 38 + 12, 260);
    dropdownEl.style.left = rect.left + 'px';
    dropdownEl.style.width = rect.width + 'px';
    if (spaceBelow < dropHeight + 8 && rect.top > dropHeight) {
      dropdownEl.style.top = 'auto';
      dropdownEl.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
    } else {
      dropdownEl.style.top = (rect.bottom + 6) + 'px';
      dropdownEl.style.bottom = 'auto';
    }
    renderDropdownOptions();
    dropdownEl.classList.add('open');
    triggerEl.classList.add('open');
    dropdownOpen = true;
  }

  function closeDropdown() {
    dropdownEl.classList.remove('open');
    triggerEl.classList.remove('open');
    dropdownOpen = false;
  }

  triggerEl.addEventListener('click', function(e) {
    e.stopPropagation();
    if (dropdownOpen) closeDropdown();
    else openDropdown();
  });

  document.addEventListener('click', function(e) {
    if (!e.target.closest('#positionSelect')) closeDropdown();
  });

  document.getElementById('submitBtn').addEventListener('click', async function() {
    var name = document.getElementById('formName').value.trim();
    var qq = document.getElementById('formQQ').value.trim();
    var note = document.getElementById('formNote').value.trim();
    var btn = document.getElementById('submitBtn');

    if (!name) { setFormNote('请输入姓名', '#ffb3b3'); return; }
    if (!selectedPositionId) { setFormNote('请选择意向岗位', '#ffb3b3'); return; }
    if (!qq) { setFormNote('请输入QQ联系方式', '#ffb3b3'); return; }

    var pos = positions.find(function(p) { return String(p.id) === String(selectedPositionId); });
    if (!pos) { setFormNote('请选择有效的意向岗位', '#ffb3b3'); return; }

    btn.disabled = true;
    btn.textContent = '提交中…';
    setFormNote('正在提交，请稍候…', '');

    try {
      await request('/recruit-applicants', {
        method: 'POST',
        body: JSON.stringify({
          name: name,
          position_id: pos.id,
          position_title: pos.title,
          qq: qq,
          note: note
        })
      });
      document.getElementById('formName').value = '';
      document.getElementById('formQQ').value = '';
      document.getElementById('formNote').value = '';
      selectedPositionId = '';
      triggerEl.querySelector('span').textContent = '请选择意向岗位';
      triggerEl.querySelector('span').classList.add('placeholder');
      document.querySelectorAll('.position-card').forEach(function(c) { c.classList.remove('selected'); });
      setFormNote('报名提交成功，我们会尽快与你联系', '#a0f0c0');
    } catch (e) {
      setFormNote('提交失败：' + (e.message || '请稍后重试'), '#ffb3b3');
    } finally {
      btn.disabled = false;
      btn.textContent = '提交报名';
    }
  });

  request('/recruitments').then(function(json) {
    positions = Array.isArray(json.data) ? json.data : [];
    renderPositions();
  }).catch(function(e) {
    console.warn('加载招聘岗位失败:', e);
    document.getElementById('positionsGrid').innerHTML = '<div class="empty-card">加载失败，请刷新重试</div>';
  });
})();
</script>

</body>
</html>
