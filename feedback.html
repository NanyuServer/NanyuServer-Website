<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>有求必应 — 南渝万能墙</title>
<style>
  @font-face {
    font-family: 'OPPO Sans';
    src: url('OPPO Sans 4.0.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --p1: #0d0818; --p2: #1a0e3a; --p3: #2d1b6b; --p4: #4c2fa3;
    --p5: #7b55d4; --p6: #a87fe8; --p7: #d4b8f5; --p8: #f0e6ff;
    --gold: #e8c97a; --gold2: #f5dfa0; --rose: #e86fa3; --teal: #5de8d0;
    --easing: cubic-bezier(0.16, 1, 0.3, 1);
    --font-title: 'OPPO Sans', sans-serif;
    --font-body: 'OPPO Sans', sans-serif;
    --font-ui: 'OPPO Sans', sans-serif;
  }

  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; -moz-osx-font-smoothing: grayscale; -webkit-font-smoothing: antialiased; }
  body { text-rendering: optimizeLegibility; line-height: 1.65; }
  body { font-family: var(--font-body); background: var(--p1); color: var(--p8); overflow-x: hidden; cursor: none; }

  h1, h2, h3, h4, h5, h6, .page-title, .info-title, .filter-label, .results-count { font-weight: 800; }
  @media (hover: none), (pointer: coarse) {
    body { cursor: auto; }
    .cursor, .cursor-ring { display: none !important; }
  }

  .cursor { position: fixed; top:0;left:0; pointer-events:none; z-index:9999; width:12px;height:12px; background:var(--p6); border-radius:50%; transform:translate(-50%,-50%); transition:width 0.3s,height 0.3s,background 0.3s; mix-blend-mode:screen; }
  .cursor-ring { position:fixed;top:0;left:0;pointer-events:none;z-index:9998;width:36px;height:36px;border:1px solid rgba(168,127,232,0.5);border-radius:50%;transform:translate(-50%,-50%);transition:transform 0.25s var(--easing),width 0.4s,height 0.4s; }
  body:has(a:hover) .cursor, body:has(button:hover) .cursor { width:20px;height:20px;background:var(--gold); }
  body:has(a:hover) .cursor-ring, body:has(button:hover) .cursor-ring { width:56px;height:56px;border-color:var(--gold); }
  body::before { content:'';position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:0.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }

  /* Nav */
  nav { position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:1rem 3rem 1rem 4px;backdrop-filter:blur(24px);background:rgba(13,8,24,0.55);border-bottom:1px solid rgba(255,255,255,0.08);box-shadow:0 16px 40px rgba(0,0,0,0.14); }
  .logo { display:flex;align-items:center; margin-left: 28px; }
  .logo img { display:block;height:3.2rem;width:auto;transform:none; }
  .nav-links { display:flex;gap:1rem;list-style:none; }
  .nav-links a { font-family:var(--font-ui);color:var(--p7);text-decoration:none;font-size:0.82rem;letter-spacing:0.06em;position:relative;transition:color 0.3s; }
  .nav-links a::after { content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform 0.4s var(--easing); }
  .nav-links a:hover { color:var(--gold); }
  .nav-links a:hover::after, .nav-links a.active::after { transform:scaleX(1);transform-origin:left; }
  .nav-links a.active { color:var(--gold); }
  .nav-cta { font-family:var(--font-ui);padding:0.55rem 1.4rem;border:1px solid var(--p5);background:transparent;color:var(--p7);font-size:0.8rem;letter-spacing:0.06em;cursor:none;border-radius:2px;transition:all 0.3s;position:relative;overflow:hidden; }
  .nav-cta::before { content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--p4),var(--rose));opacity:0;transition:opacity 0.3s; }
  .nav-cta:hover::before { opacity:1; }
  .nav-cta span { position:relative;z-index:1; }

  .hamburger { display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none;z-index:600; }
  .hamburger span { display:block;width:24px;height:2px;background:var(--p7);border-radius:2px;transition:all 0.3s var(--easing); }
  .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity:0;transform:scaleX(0); }
  .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
  .mobile-nav {
    display: flex; position: fixed; top: 68px; left: 50%; transform: translateX(-50%);
    z-index: 490; width: calc(100% - 48px); max-width: 520px; border-radius: 12px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(8px); box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    flex-direction: column; align-items: stretch; gap: 0.6rem; padding: 0.4rem;
    opacity: 0; transform: translateY(-8px) translateX(-50%); visibility: hidden;
    pointer-events: none; transition: opacity 0.25s var(--easing), transform 0.25s var(--easing), visibility 0.25s ease;
  }
  .mobile-nav.open { opacity: 1; transform: translateY(0) translateX(-50%); visibility: visible; pointer-events: auto; }
  .mobile-nav a { font-family:var(--font-ui); font-size:1rem; color:var(--p7); text-decoration:none; letter-spacing:0.04em; padding:0.6rem 0.9rem; text-align:left; display:block; }
  .mobile-nav a + a { border-top: 1px solid rgba(123,85,212,0.06); }
  .mobile-nav a:hover { color:var(--gold); }
  .mobile-nav .mobile-cta { padding:0.7rem 1.2rem; background:linear-gradient(135deg,var(--p4),var(--rose)); color:white; border:none; border-radius:8px; font-family:var(--font-ui); font-size:0.95rem; letter-spacing:0.08em; }

  /* Page header */
  .page-hero {
    padding: 7rem 2rem 2.5rem;
    background: linear-gradient(180deg, var(--p2) 0%, var(--p1) 100%);
    position: relative; overflow: hidden; text-align: center;
  }
  .page-hero::before {
    content:'';position:absolute;inset:0;
    background-image:linear-gradient(rgba(75,47,163,0.07) 1px,transparent 1px),linear-gradient(90deg,rgba(75,47,163,0.07) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%);
  }
  .page-orb { position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;top:-80px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(circle,rgba(75,47,163,0.5) 0%,rgba(232,111,163,0.2) 50%,transparent 70%); }
  .page-hero-content { position:relative;z-index:2; }
  .page-label { display:inline-flex;align-items:center;gap:0.6rem;font-family:var(--font-ui);font-size:0.7rem;letter-spacing:0.2em;color:var(--gold);margin-bottom:1rem; }
  .page-label::before,.page-label::after { content:'';display:block;width:20px;height:1px;background:var(--gold); }
  .page-title { font-family:var(--font-title);font-size:clamp(2rem,5vw,3.5rem);font-weight:700;letter-spacing:0.04em;background:linear-gradient(135deg,var(--gold),var(--p7),var(--p6));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:0.8rem; }
  .page-sub { font-family:var(--font-body);color:var(--p6);font-size:0.95rem;letter-spacing:0.06em; }

  /* Main content */
  .content-section { max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

  /* Form card */
  .form-card {
    background: linear-gradient(135deg, rgba(29,14,58,0.85), rgba(13,8,24,0.6));
    border: 1px solid rgba(75,47,163,0.2); border-radius: 12px;
    padding: 2rem; margin-bottom: 3rem; position: relative; overflow: hidden;
  }
  .form-card::before { content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--p4),var(--p6),var(--rose)); }
  .form-card-title { font-family:var(--font-title);font-size:1.1rem;font-weight:700;color:var(--p8);margin-bottom:1.5rem;display:flex;align-items:center;gap:0.6rem; }

  .form-grid { display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem; }
  .form-group { display:flex;flex-direction:column;gap:0.4rem; }
  .form-group.full { grid-column:1/-1; }
  .form-label { font-size:0.72rem;letter-spacing:0.1em;color:var(--gold); }
  .form-select, .form-textarea {
    font-family:var(--font-ui);font-size:0.875rem;color:var(--p8);
    background:rgba(13,8,24,0.7);border:1px solid rgba(123,85,212,0.3);
    border-radius:8px;padding:0.65rem 0.9rem;outline:none;
    transition:border-color 0.3s,box-shadow 0.3s;width:100%;
  }
  .form-select:focus, .form-textarea:focus { border-color:var(--p5);box-shadow:0 0 0 3px rgba(123,85,212,0.15); }
  .form-select option { background:var(--p2);color:var(--p8); }
  .form-textarea { resize:vertical;min-height:100px;line-height:1.7; }
  .form-actions { display:flex;gap:0.8rem;justify-content:flex-end; }
  .btn-submit {
    font-family:var(--font-ui);font-size:0.85rem;font-weight:500;letter-spacing:0.06em;
    padding:0.7rem 1.8rem;background:linear-gradient(135deg,var(--p4),var(--rose));
    border:none;border-radius:8px;color:white;cursor:pointer;
    transition:all 0.3s;box-shadow:0 6px 20px rgba(75,47,163,0.4);
  }
  .btn-submit:hover { transform:translateY(-2px);box-shadow:0 10px 28px rgba(75,47,163,0.6); }
  .btn-submit:disabled { opacity:0.5;cursor:not-allowed;transform:none; }

  /* Feedback display */
  .feedback-list { margin-top: 3rem; }
  .feedback-list-title { font-family:var(--font-title);font-size:1.1rem;font-weight:700;color:var(--p8);margin-bottom:1.5rem; }

  .cards-grid { display: grid; gap: 1rem; }

  .submission-card {
    background: linear-gradient(135deg, rgba(29,14,58,0.85) 0%, rgba(13,8,24,0.6) 100%);
    border: 1px solid rgba(75,47,163,0.2); border-radius: 10px;
    padding: 1.6rem 1.8rem; position: relative; overflow: hidden;
    transition: border-color 0.3s, transform 0.3s var(--easing), box-shadow 0.3s;
  }
  .submission-card:hover { border-color: rgba(123,85,212,0.45); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
  .submission-card::before { content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--p5),transparent);transform:scaleX(0);transition:transform 0.4s; }
  .submission-card:hover::before { transform:scaleX(1); }

  .card-header { display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.9rem;gap:1rem;flex-wrap:wrap; }
  .card-type-badge {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.08em;
    padding: 0.3rem 0.8rem; border-radius: 100px;
    border: 1px solid; white-space: nowrap;
  }
  .type-校园资讯 { color:#fbbf24; border-color:rgba(251,191,36,0.35); background:rgba(251,191,36,0.08); }
  .type-问题反馈 { color:#60a5fa; border-color:rgba(96,165,250,0.35); background:rgba(96,165,250,0.08); }

  .card-time { font-family:var(--font-ui);font-size:0.72rem;color:var(--p5);letter-spacing:0.04em;white-space:nowrap; }
  .card-content { font-family:var(--font-body);font-size:0.93rem;line-height:1.8;color:var(--p7);letter-spacing:0.04em;margin:0.8rem 0; }

  .card-status { display:flex;gap:0.8rem;margin-top:0.8rem;flex-wrap:wrap; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    font-family: var(--font-ui); font-size: 0.7rem; letter-spacing: 0.06em;
    padding: 0.3rem 0.7rem; border-radius: 100px; border: 1px solid;
  }
  .status-approved { color:#34d399; border-color:rgba(52,211,153,0.35); background:rgba(52,211,153,0.08); }
  .status-transferred { color:#f59e0b; border-color:rgba(245,158,11,0.35); background:rgba(245,158,11,0.08); }
  .status-replied { color:#60a5fa; border-color:rgba(96,165,250,0.35); background:rgba(96,165,250,0.08); }

  .card-reply { margin-top:0.8rem;padding:0.8rem;border-left:3px solid rgba(96,165,250,0.25);background:rgba(96,165,250,0.03);border-radius:6px;font-size:0.85rem;line-height:1.6; }
  .card-reply-title { font-weight:600;color:var(--p6);margin-bottom:0.4rem; }
  .card-reply-content { color:var(--p7); }

  /* Empty state */
  .state-box {
    text-align: center; padding: 3rem 2rem;
    border: 1px dashed rgba(123,85,212,0.2); border-radius: 12px;
  }
  .state-title { font-family:var(--font-title);font-size:1rem;color:var(--p6);margin-bottom:0.5rem; }
  .state-sub { font-family:var(--font-body);font-size:0.85rem;color:var(--p5); }

  /* Toast */
  .toast {
    position:fixed;bottom:2rem;right:2rem;z-index:9999;
    padding:0.9rem 1.4rem;border-radius:10px;font-size:0.85rem;letter-spacing:0.04em;
    display:flex;align-items:center;gap:0.6rem;
    box-shadow:0 12px 40px rgba(0,0,0,0.4);
    transform:translateY(80px);opacity:0;
    transition:all 0.4s var(--easing);
  }
  .toast.show { transform:none;opacity:1; }
  .toast-success { background:linear-gradient(135deg,rgba(52,211,153,0.2),rgba(16,185,129,0.15));border:1px solid rgba(52,211,153,0.4);color:#34d399; }
  .toast-error { background:linear-gradient(135deg,rgba(248,113,113,0.2),rgba(239,68,68,0.15));border:1px solid rgba(248,113,113,0.4);color:#f87171; }

  @media (max-width: 768px) {
    nav { padding:1rem 1.5rem 1rem 2px; }
    .logo { margin-left: 14px; }
    .logo img { height:1.92rem; }
    .nav-links,.nav-cta { display:none; }
    .hamburger { display:flex; }
    .page-hero { padding:7rem 1.25rem 3rem; }
    .content-section { padding:1.5rem; }
    .form-grid { grid-template-columns:1fr; }
    .submission-card { padding:1.2rem; }
  }
</style>
<script src="feedback.js" defer></script>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="mobile-nav" id="mobileNav">
  <a href="index.html" onclick="closeMobileNav()">北关鱼的驿站</a>
  <a href="query.html" onclick="closeMobileNav()">稿件查询</a>
  <a href="course.html" onclick="closeMobileNav()">公益课程</a>
  <a href="feedback.html" onclick="closeMobileNav()">有求必应</a>
  <a href="cooperation.html" onclick="closeMobileNav()">合作与共创</a>
  <a href="recruit.html" onclick="closeMobileNav()">招贤纳士</a>
  <a href="about.html" onclick="closeMobileNav()">关于我们</a>
  <button class="mobile-cta" onclick="window.location.href='https://qm.qq.com/q/FHAbiDBIQO'">立即进入</button>
</div>

<nav>
  <div class="logo">
    <img src="logo.webp" alt="南渝万能墙 logo">
  </div>
  <ul class="nav-links">
    <li><a href="index.html">返回主页</a></li>
    <li><a href="query.html">稿件查询</a></li>
    <li><a href="course.html">公益课程</a></li>
    <li><a href="feedback.html" class="active">有求必应</a></li>
    <li><a href="cooperation.html">合作与共创</a></li>
    <li><a href="recruit.html">招贤纳士</a></li>
    <li><a href="about.html">关于我们</a></li>
  </ul>
  <button class="nav-cta" onclick="window.location.href='https://qm.qq.com/q/FHAbiDBIQO'"><span>立即进入</span></button>
  <button class="hamburger" id="hamburger" onclick="toggleMobileNav()" aria-label="菜单">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page-hero">
  <div class="page-orb"></div>
  <div class="page-hero-content">
    <div class="page-label">意见反馈</div>
    <h1 class="page-title">有求必应</h1>
    <p class="page-sub">提交您的宝贵意见和建议，帮助我们不断改进和完善</p>
  </div>
</div>

<div class="content-section">
  <div class="form-card">
    <div class="form-card-title">📝 提交反馈</div>
    <form id="feedback-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="category" class="form-label">反馈类型 *</label>
          <select id="category" class="form-select" required>
            <option value="">请选择反馈类型</option>
            <option value="校园资讯">校园资讯</option>
            <option value="问题反馈">问题反馈</option>
          </select>
        </div>
        <div class="form-group full">
          <label for="feedback-content" class="form-label">反馈内容 *</label>
          <textarea id="feedback-content" class="form-textarea" placeholder="请输入您的反馈内容..." required></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-submit">提交反馈</button>
      </div>
    </form>
  </div>

  <div class="feedback-list">
    <h2 class="feedback-list-title">📋 已审核内容</h2>
    <div class="cards-grid" id="feedback-display">
      <div class="state-box">
        <div class="state-title">暂无已审核内容</div>
        <div class="state-sub">已审核的反馈将显示在此</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Cursor ──
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;});
(function animCursor(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;cursor.style.left=mx+'px';cursor.style.top=my+'px';ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(animCursor);})();

// ── Mobile nav ──
function toggleMobileNav(){const n=document.getElementById('mobileNav'),b=document.getElementById('hamburger');n.classList.toggle('open');b.classList.toggle('open');}
function closeMobileNav(){document.getElementById('mobileNav').classList.remove('open');document.getElementById('hamburger').classList.remove('open');}

// ── Toast notification ──
function showToast(message, type = 'success') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast show toast-${type}`;
  setTimeout(() => { toast.classList.remove('show'); }, 3000);
}
</script>
