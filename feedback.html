<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>反馈页面</title>
<link rel="stylesheet" href="styles.css" />
<script src="feedback.js" defer></script>
</head>
<body>
  <nav>
    <!-- 导航栏内容 -->
  </nav>
  <main>
    <section class="page-hero">
      <div class="page-hero-content">
        <h1 class="page-title">反馈中心</h1>
        <p class="page-sub">请填写以下表格提交您的反馈</p>
      </div>
    </section>

    <section class="content-section">
      <div class="form-card">
        <h2 class="form-card-title">提交反馈</h2>
        <form id="feedback-form">
          <div class="form-group">
            <label for="category" class="form-label">反馈类型</label>
            <select id="category" name="category" required>
              <option value="校园资讯">校园资讯</option>
              <option value="问题反馈">问题反馈</option>
            </select>
          </div>
          <div class="form-group">
            <label for="feedback-content" class="form-label">反馈内容</label>
            <textarea id="feedback-content" name="feedback-content" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn">提交</button>
        </form>
      </div>

      <div class="feedback-list">
        <h2 class="form-card-title">已审核内容</h2>
        <ul id="feedback-display">
          <!-- 动态加载内容 -->
        </ul>
      </div>
    </section>
  </main>

  <!-- 回复功能由管理员后台处理，页面仅显示已审核或转接的反馈 -->
</body>
</html>
